backend:
  name: github
  repo: felixpiccu-wq/laura-schunke  # z.B. laurascheunke/website
  branch: main

# Netlify Identity – bei Bedarf aktivieren:
# local_backend: true

media_folder: "images/blog"
public_folder: "/images/blog"

locale: de

collections:
  - name: "posts"
    label: "Blogposts"
    folder: "posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} – {{date}}"
    sort_field: date
    sort_direction: Descending
    fields:
      - { label: "Titel",          name: "title",    widget: "string" }
      - { label: "Datum",          name: "date",     widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Titelbild",      name: "image",    widget: "image",   required: false,
          hint: "Empfohlen: 1200×630 px, JPG" }
      - { label: "Zusammenfassung (Teaser)",  name: "excerpt",  widget: "text",
          hint: "Kurze Vorschau für Blog-Übersicht und SEO (max. 160 Zeichen)" }
      - { label: "Inhalt",         name: "body",     widget: "markdown" }
      - { label: "SEO-Beschreibung", name: "seo_desc", widget: "string", required: false,
          hint: "Wird für Meta-Description verwendet (max. 160 Zeichen)" }
      - { label: "Tags",           name: "tags",     widget: "list",    required: false,
          hint: "z.B. Angst, Depression, KVT" }
