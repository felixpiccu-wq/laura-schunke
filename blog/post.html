<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog | Laura Schunke – Heilpraktikerin für Psychotherapie Schwabach</title>
  <meta name="description" content="Blogartikel von Laura Schunke – Heilpraktikerin für Psychotherapie in Schwabach." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <!-- marked.js für Markdown → HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>

  <style>
    :root {
      --cream:     #F5F0E8;
      --sage:      #7A9E7E;
      --sage-dark: #5E8262;
      --sage-light:#EAF0EA;
      --brown:     #4A3728;
      --brown-mid: #6B5547;
      --white:     #FFFFFF;
      --font-heading: 'Playfair Display', Georgia, serif;
      --font-body:    'Inter', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      font-size: 1rem;
      line-height: 1.75;
      color: var(--brown);
      background: var(--cream);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--sage); }
    a:hover { text-decoration: underline; }

    /* ---- NAV ---- */
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(12px);
      box-shadow: 0 2px 20px rgba(74,55,40,0.09);
      padding: 1rem 0;
    }
    .nav-inner {
      max-width: 1180px; margin: 0 auto;
      padding: 0 clamp(20px,5vw,56px);
      display: flex; align-items: center; justify-content: space-between; gap: 1.5rem;
    }
    .nav-logo { font-family: var(--font-heading); font-size: 1.2rem; font-weight: 600; color: var(--brown); text-decoration: none; }
    .nav-back  { display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; color: var(--sage); text-decoration: none; }
    .nav-back:hover { text-decoration: underline; }

    /* ---- ARTIKEL ---- */
    .post-hero {
      background: var(--white);
    }
    .post-hero-img-wrap {
      position: relative;
    }
    .post-hero-img-wrap::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 180px;
      background: linear-gradient(to bottom, transparent, var(--white));
      pointer-events: none;
    }
    .post-hero-img {
      width: 100%;
      max-height: 440px;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }
    .post-header {
      max-width: 760px;
      margin: 0 auto;
      padding: clamp(2rem,5vw,3.5rem) clamp(20px,5vw,40px) 2rem;
    }
    .post-meta {
      font-size: 0.82rem;
      color: var(--sage);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.75rem;
    }
    .post-header h1 {
      font-family: var(--font-heading);
      font-size: clamp(1.75rem, 4.5vw, 2.75rem);
      font-weight: 600;
      color: var(--brown);
      line-height: 1.25;
      margin-bottom: 1rem;
    }
    .post-excerpt {
      font-size: 1.1rem;
      color: var(--brown-mid);
      line-height: 1.7;
    }

    /* ---- BODY ---- */
    .post-body {
      max-width: 760px;
      margin: 0 auto;
      padding: 2rem clamp(20px,5vw,40px) clamp(48px,7vw,80px);
    }
    .post-body p  { color: var(--brown-mid); margin-bottom: 1.25rem; font-size: 1.05rem; line-height: 1.85; }
    .post-body h2 { font-family: var(--font-heading); font-size: 1.5rem; color: var(--brown); margin: 2.5rem 0 0.75rem; }
    .post-body h3 { font-family: var(--font-heading); font-size: 1.2rem; color: var(--brown); margin: 2rem 0 0.6rem; }
    .post-body ul, .post-body ol { margin: 0.75rem 0 1.25rem 1.75rem; color: var(--brown-mid); }
    .post-body li { margin-bottom: 0.4rem; font-size: 1.05rem; }
    .post-body blockquote {
      border-left: 3px solid var(--sage);
      padding: 1rem 1.5rem;
      margin: 1.5rem 0;
      background: var(--sage-light);
      border-radius: 0 10px 10px 0;
      font-style: italic;
      color: var(--brown-mid);
    }
    .post-body img { max-width: 100%; border-radius: 12px; margin: 1.5rem 0; }
    .post-body strong { color: var(--brown); }
    .post-body a { color: var(--sage); text-decoration: underline; }

    /* ---- CTA BOX ---- */
    .post-cta {
      background: var(--sage-light);
      border-radius: 18px;
      padding: 2rem 2.5rem;
      text-align: center;
      margin: 3rem 0;
    }
    .post-cta h3 { font-family: var(--font-heading); font-size: 1.3rem; margin-bottom: 0.75rem; }
    .post-cta p  { color: var(--brown-mid); margin-bottom: 1.5rem; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.9rem 2rem; border-radius: 9999px;
      font-size: 0.97rem; font-weight: 500;
      background: var(--sage); color: var(--white);
      transition: background 0.25s, transform 0.25s;
      text-decoration: none;
    }
    .btn:hover { background: var(--sage-dark); transform: translateY(-2px); text-decoration: none; }

    /* ---- BACK ---- */
    .post-back {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.9rem; color: var(--sage);
      text-decoration: none; margin-bottom: 2rem;
    }
    .post-back:hover { text-decoration: underline; }

    /* ---- LOADING ---- */
    .loading { text-align: center; padding: 6rem 1rem; color: var(--brown-mid); }

    /* ---- FOOTER ---- */
    footer {
      background: var(--brown);
      color: rgba(255,255,255,0.65);
      padding: 1.5rem 0;
      text-align: center;
      font-size: 0.85rem;
    }
    footer a { color: rgba(255,255,255,0.75); }
  </style>
</head>
<body>

<nav class="nav" aria-label="Navigation">
  <div class="nav-inner">
    <a href="/" class="nav-logo">Laura Schunke</a>
    <a href="/blog/" class="nav-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      Alle Artikel
    </a>
  </div>
</nav>

<main id="postContainer">
  <div class="loading">
    <p>Artikel wird geladen …</p>
  </div>
</main>

<footer>
  <p>© 2025 Laura Schunke ·
    <a href="/">Startseite</a> ·
    <a href="/impressum.html">Impressum</a> ·
    <a href="/datenschutz.html">Datenschutz</a>
  </p>
</footer>

<script>
  /*
   * PFLICHT: felixpiccu-wq und laura-schunke ersetzen!
   */
  const GITHUB_USER = 'felixpiccu-wq';
  const GITHUB_REPO = 'laura-schunke';
  const RAW_BASE    = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/posts`;

  const container = document.getElementById('postContainer');

  function parseFrontmatter(raw) {
    const match = raw.match(/^---\n([\s\S]+?)\n---/);
    if (!match) return { body: raw, meta: {} };
    const meta = {};
    match[1].split('\n').forEach(line => {
      const [key, ...rest] = line.split(':');
      if (key && rest.length) meta[key.trim()] = rest.join(':').trim().replace(/^["']|["']$/g, '');
    });
    return { body: raw.replace(/^---[\s\S]+?---\n/, ''), meta };
  }

  function formatDate(str) {
    if (!str) return '';
    return new Date(str).toLocaleDateString('de-DE', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function getSlug() {
    const params = new URLSearchParams(window.location.search);
    return params.get('post');
  }

  async function loadPost() {
    const slug = getSlug();
    if (!slug) { showError('Kein Artikel angegeben.'); return; }

    try {
      const url = `${RAW_BASE}/${slug}.md`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Artikel nicht gefunden');
      const raw = await res.text();
      const { body, meta } = parseFrontmatter(raw);

      /* Titel in <title> setzen */
      if (meta.title) {
        document.title = `${meta.title} | Laura Schunke`;
      }
      if (meta.seo_desc) {
        document.querySelector('meta[name="description"]').content = meta.seo_desc;
      }

      /* Artikel rendern */
      const heroImg = meta.image
        ? `<img src="${meta.image}" alt="${meta.title || ''}" class="post-hero-img" />`
        : `<img src="/images/psychotherapie-schwabach-blog.jpg" alt="Blog Laura Schunke" class="post-hero-img" />`;

      container.innerHTML = `
        <div class="post-hero">
          <div class="post-hero-img-wrap">${heroImg}</div>
          <div class="post-header">
            <p class="post-meta">${formatDate(meta.date)}</p>
            <h1>${meta.title || 'Artikel'}</h1>
            ${meta.excerpt ? `<p class="post-excerpt">${meta.excerpt}</p>` : ''}
          </div>
        </div>
        <div class="post-body">
          <a href="/blog/" class="post-back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            Zurück zum Blog
          </a>
          ${marked.parse(body)}
          <div class="post-cta">
            <h3>Bereit für den nächsten Schritt?</h3>
            <p>Du hast Fragen oder möchtest ein unverbindliches Erstgespräch vereinbaren?
               Ich freue mich auf deine Nachricht.</p>
            <a href="/#kontakt" class="btn">Jetzt Kontakt aufnehmen</a>
          </div>
        </div>`;

    } catch (err) {
      showError('Der Artikel konnte nicht geladen werden.');
    }
  }

  function showError(msg) {
    container.innerHTML = `
      <div class="loading">
        <p>${msg}</p>
        <p style="margin-top:1rem"><a href="/blog/">Zurück zum Blog</a></p>
      </div>`;
  }

  loadPost();
</script>

</body>
</html>
